# Global development tool manifest. lm-bootstrap.sh copies this file to
# ~/.config/mise/config.toml and installs tools better managed outside APT.
[tools]
"aqua:aws/aws-cli" = "latest"
azure = { version = "latest", uvx_args = "--prerelease=allow" }
azure-functions-core-tools = "latest"
"cargo:tree-sitter-cli" = "latest"
elixir = "1.19.5-otp-28"
erlang = "28"
fwup = "latest"
gh = "latest"
go = "latest"
hugo-extended = "latest"
java = "temurin-17"
lazydocker = "latest"
neovim = "latest"
node = "22.20.0"
"npm:@openai/codex" = "latest"
"pipx:esptool" = "latest"
"pipx:platformio" = "latest"
python = "3.12"
rebar = "latest"
ruby = "latest"
rust = "latest"
uv = "latest"
yazi = "latest"
