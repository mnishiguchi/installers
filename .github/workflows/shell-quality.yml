name: Shell quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell scripts
        run: ./test/lint.sh
      - name: Test focused Cinnamon keybinding snapshot operations
        run: bash test/lm-desktop-settings-keybindings-test.sh

  macos-bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install regression test dependencies
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            command -v fish >/dev/null || brew install fish
            command -v jq >/dev/null || brew install jq
          else
            sudo apt-get update && sudo apt-get install --yes fish jq
          fi
      - name: Test bootstrap without installing packages
        run: /bin/bash test/macos-bootstrap.sh
      - name: Check Brewfile syntax
        run: |
          for manifest in manifests/Brewfile*; do ruby -c "$manifest"; done
