name: Shell quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell scripts
        run: ./test/lint.sh
      - name: Test focused Cinnamon keybinding snapshot operations
        run: bash test/lm-desktop-settings-keybindings-test.sh

  macos-bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install regression test dependencies
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            command -v fish >/dev/null || brew install fish
            command -v jq >/dev/null || brew install jq
          else
            sudo apt-get update && sudo apt-get install --yes fish jq
          fi
      - name: Test bootstrap without installing packages
        run: /bin/bash test/macos-bootstrap.sh
      - name: Check Brewfile syntax
        run: |
          for manifest in manifests/Brewfile*; do ruby -c "$manifest"; done

  fedora-asahi-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install regression test dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq gnupg
      - name: Test Fedora Asahi bootstrap without installing packages
        run: bash test/fedora-asahi-bootstrap.sh
      - name: Test KDE desktop configuration without a live session
        run: bash test/kde-desktop-config.sh
      - name: Test KDE shortcuts without a live session
        run: bash test/kde-shortcuts-config.sh
      - name: Test standalone 1Password without system changes
        run: bash test/fedora-1password.sh
      - name: Test KDE Compact Stats without a live session
        run: bash test/kde-panel-stats.sh

  browser-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install regression test dependency
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Test browser policies without installing extensions
        run: bash test/browser-extensions.sh
      - name: Test Brave settings without changing system policies
        run: bash test/browser-settings.sh
